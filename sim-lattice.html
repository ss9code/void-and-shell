<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 02: 格子拘束 - void-and-shell</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: sans-serif; }
        .ui-panel { position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.7); padding: 15px; border: 1px solid #333; }
        .back-link { color: #4CAF50; text-decoration: none; margin-bottom: 15px; display: inline-block; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
    <!-- p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
</head>
<body>
    <div class="ui-panel">
        <a href="index.html" class="back-link">← 目次へ戻る</a>
        <h2>Experiment 02: Lattice Grid</h2>
        <p style="font-size: 12px; color: #aaa; max-width: 250px;">
            私たちが無意識に縛られている「双極の格子」。<br>
            空間がXY軸で区切られ、中央（0,0）が特異点として引力を持っている状態。
        </p>
    </div>

    <script>
        // 格子拘束を表現するp5.jsスクリプト
        function setup() {
            createCanvas(windowWidth, windowHeight);
        }

        function draw() {
            background(10, 10, 15, 50); // 軌跡を少し残す
            translate(width / 2, height / 2); // 画面中央を(0,0)にする

            strokeWeight(1);
            
            // 時間の経過
            let t = frameCount * 0.01;

            // 格子の描画（ゆらぎを持たせる）
            stroke(50, 50, 80);
            let gridSize = 40;
            for (let x = -width/2; x < width/2; x += gridSize) {
                line(x, -height/2, x, height/2);
            }
            for (let y = -height/2; y < height/2; y += gridSize) {
                line(-width/2, y, width/2, y);
            }

            // XYの絶対的な軸（双極の基準線）
            stroke(100, 255, 100, 150);
            strokeWeight(2);
            line(-width/2, 0, width/2, 0); // X軸
            line(0, -height/2, 0, height/2); // Y軸

            // 特異点（中心にあるゼロ）への拘束を表現するパーティクル
            noStroke();
            fill(255, 150);
            let numParticles = 200;
            for (let i = 0; i < numParticles; i++) {
                // 中心へ引き寄せられながら回る動き
                let angle = (i * TWO_PI / numParticles) + t * (i % 3 + 1);
                // 中心からの距離（サイン波で振動させ、ゼロに近づかせる）
                let radius = 200 * abs(sin(t * 0.5 + i)) + 10; 
                
                let px = radius * cos(angle);
                let py = radius * sin(angle);
                
                ellipse(px, py, 3, 3);
            }

            // 中心（原点）の表現
            fill(255, 50, 50);
            ellipse(0, 0, 15 + sin(t*5)*5, 15 + sin(t*5)*5);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
